services:
  - type: web
    name: intellekt-plus-schedule
    runtime: node
    plan: starter
    buildCommand: npm install && npm run migrate && node db/migrate-from-neon.js
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: intellekt-plus-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NEON_DATABASE_URL
        value: postgresql://neondb_owner:npg_20BjbaEnLitH@ep-cold-block-af99v40c-pooler.c-2.us-west-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require

databases:
  - name: intellekt-plus-db
    plan: starter
    databaseName: intellekt_plus_db
    user: intellekt_plus_db_user
